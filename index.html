<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- HAVEN Favicon System -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  
  <!-- SEO -->
  <title>HAVEN — Digital Experiences, Made Remarkable</title>
  <meta name="description" content="HAVEN creates premium digital experiences. Discover luxury website designs, explore templates, customize your vision, and launch something remarkable." />
  
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="HAVEN — Digital Experiences, Made Remarkable" />
  <meta property="og:description" content="Premium digital experiences. Luxury website design and development." />
  <meta property="og:url" content="https://yourusername.github.io/haven/" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#0a0a0a" />
  
  <style>
    /* Immediate Dark Background - No Flash */
    html {
      background-color: #0a0a0a;
    }
    
    /* Loading State */
    #root {
      min-height: 100vh;
    }
    
    /* Prevent FOUC */
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a0a;
      color: #faf8f4;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    * {
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
